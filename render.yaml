services:
  - type: web
    name: clinica-sistema-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_TIMEOUT
        value: "3600"
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        value: ./database.sqlite
