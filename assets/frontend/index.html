<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clínica Sistema</title>
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Estilos -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

  <!-- Layout Principal da SPA -->
  <div id="app-layout" style="display: none;">
    <!-- Mobile Header -->
    <header class="mobile-header">
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
      <a href="#/pacientes" style="text-decoration: none; color: inherit;"><div class="sidebar-title">Clínica Sistema</div></a>
    </header>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar Lateral -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">🏥</div>
        <a href="#/pacientes" style="text-decoration: none; color: inherit;"><div class="sidebar-title">Clínica Sistema</div></a>
      </div>
      
      <nav class="sidebar-nav">
        <div class="nav-section-label">Cadastros</div>
        <a href="#/pacientes" class="nav-item">
          <span class="nav-icon">👥</span>
          Pacientes
        </a>
        <a href="#/produtos" class="nav-item">
          <span class="nav-icon">📦</span>
          Produtos
        </a>
        <div class="nav-section-label">Agenda</div>
        <a href="#/agendamentos" class="nav-item">
          <span class="nav-icon">📅</span>
          Agendamentos
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item logout" id="btn-logout">
          <span class="nav-icon">🚪</span>
          Sair do Sistema
        </button>
      </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content" id="page-content">
      <!-- O conteúdo das páginas será renderizado aqui pelo app.js -->
    </main>
  </div>

  <!-- Container principal (usado pelo Login) -->
  <div id="app"></div>

  <!-- Scripts -->
  <script src="/js/validators.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/modal.js"></script>
  
  <!-- Pages -->
  <script src="/js/pages/login.js"></script>
  <script src="/js/pages/register.js"></script>
  <script src="/js/pages/patients.js"></script>
  <script src="/js/pages/products.js"></script>
  <script src="/js/pages/appointments.js"></script>
  
  <!-- Core -->
  <script src="/js/app.js"></script>
</body>
</html>
